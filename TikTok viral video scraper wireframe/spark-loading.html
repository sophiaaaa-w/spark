<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading TikTok — Spark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
<style>:root{
  /* ── brand ─────────────────────────────── */
  --color-cyan:#00CFC8;
  --color-cyan-dim:#00A8A3;
  --color-cyan-wash:#E6FBFA;
  --color-magenta:#FE2C55;
  --color-magenta-hover:#E62149;
  --color-magenta-wash:#FFEEF1;

  /* ── surfaces ──────────────────────────── */
  --color-bg:#FFFFFF;
  --color-surface:#FFFFFF;
  --color-surface-sunken:#F6F6F7;
  --color-surface-hover:rgba(10,10,11,0.03);
  --color-border:rgba(10,10,11,0.10);
  --color-border-strong:rgba(10,10,11,0.22);
  --color-scrim:rgba(10,10,11,0.62);

  /* ── text ──────────────────────────────── */
  --color-text:#0E0E10;
  --color-text-secondary:#5C5C64;
  --color-text-muted:#6B6B75;
  --color-text-on-magenta:#FFFFFF;
  --color-data:#0B7F7B;

  /* ── focus / state ─────────────────────── */
  --focus-ring:0 0 0 3px rgba(0,207,200,0.28);
  --color-focus-border:var(--color-cyan);
  --color-error:var(--color-magenta);

  /* ── type families ─────────────────────── */
  --font-display:"Satoshi","General Sans",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"Geist Mono","JetBrains Mono",ui-monospace,monospace;

  /* ── type scale ────────────────────────── */
  --text-h1:52px;
  --text-h2:32px;
  --text-h3:24px;
  --text-lg:18px;
  --text-body:16px;
  --text-sm:15px;
  --text-xs:13px;
  --text-micro:12px;
  --text-nano:11px;

  --leading-tight:1.05;
  --leading-snug:1.3;
  --leading-normal:1.55;

  --tracking-tight:-0.025em;
  --tracking-normal:0;
  --tracking-wide:0.08em;
  --tracking-wider:0.12em;

  --weight-regular:400;
  --weight-medium:500;
  --weight-bold:700;
  --weight-black:900;

  /* ── spacing scale ─────────────────────── */
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:24px;
  --space-6:32px;
  --space-7:48px;
  --space-8:64px;
  --space-9:96px;

  /* ── layout ────────────────────────────── */
  --width-content:1120px;
  --width-input:480px;
  --width-prose:560px;
  --width-popover:340px;
  --height-topbar:56px;
  --height-control:48px;
  --card-min:212px;
  --grid-gap:20px;

  /* ── radii / elevation / motion ────────── */
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-pill:999px;
  --shadow-input:0 1px 2px rgba(10,10,11,0.04);
  --shadow-card:0 10px 28px rgba(10,10,11,0.10),0 1px 2px rgba(10,10,11,0.05);
  --shadow-popover:0 12px 32px rgba(10,10,11,0.12),0 1px 3px rgba(10,10,11,0.06);
  --duration-fast:120ms;
  --duration-base:150ms;
  --duration-slow:220ms;
  --ease:cubic-bezier(0.2,0.8,0.3,1);

  /* ── background bloom ──────────────────── */
  --bloom-blur:130px;
  --bloom-opacity-cyan:0.28;
  --bloom-opacity-magenta:0.20;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-body);
  font-size:var(--text-body);
  line-height:var(--leading-normal);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--color-cyan-dim);text-decoration:none}
a:hover{color:var(--color-data)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none !important}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ── wordmark ─────────────────────────────── */
.wordmark{
  font-family:var(--font-mono);
  font-size:var(--text-nano);
  letter-spacing:var(--tracking-wider);
  color:var(--color-text-muted);
  text-transform:uppercase;
}
.wordmark:hover{color:var(--color-text-secondary)}

/* ── threshold pills — STATEMENT, not control ── */
.thresholds{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:var(--space-2);max-width:var(--width-prose);
}
.th{
  padding:var(--space-1) var(--space-3);
  font-size:var(--text-micro);line-height:20px;
  color:var(--color-text-secondary);
  background:var(--color-surface-sunken);
  border-radius:var(--radius-pill);
  white-space:nowrap;cursor:default;
}

/* ── drifting bloom ───────────────────────── */
.bloom{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bloom__orb{position:absolute;border-radius:50%;filter:blur(var(--bloom-blur))}
.bloom__orb--cyan{
  width:900px;height:900px;top:-260px;left:50%;margin-left:-640px;
  background:var(--color-cyan);opacity:var(--bloom-opacity-cyan);
  animation:drift-a 26s ease-in-out infinite alternate;
}
.bloom__orb--magenta{
  width:840px;height:840px;top:-160px;left:50%;margin-left:-180px;
  background:var(--color-magenta);opacity:var(--bloom-opacity-magenta);
  animation:drift-b 34s ease-in-out infinite alternate;
}
@keyframes drift-a{from{transform:translate3d(0,0,0)}to{transform:translate3d(90px,70px,0)}}
@keyframes drift-b{from{transform:translate3d(0,0,0)}to{transform:translate3d(-80px,110px,0)}}
@media (prefers-reduced-motion:reduce){.bloom__orb{animation:none}}

.topbar{
  position:relative;z-index:2;height:var(--height-topbar);
  max-width:var(--width-content);margin:0 auto;padding:0 var(--space-6);
  display:flex;align-items:center;
}
.loading{
  position:relative;z-index:1;min-height:calc(100vh - var(--height-topbar));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 var(--space-6) var(--space-9);text-align:center;
}
.loading__title{
  margin:0;font-family:var(--font-display);
  font-size:var(--text-h2);font-weight:var(--weight-black);
  letter-spacing:var(--tracking-tight);
}
.loading__meter{
  margin-top:var(--space-7);
  display:flex;align-items:center;gap:var(--space-5);
}
.bar{
  width:var(--width-input);flex:none;height:4px;border-radius:var(--radius-pill);
  background:var(--color-surface-sunken);overflow:hidden;
}
.bar__fill{
  height:100%;width:12%;border-radius:var(--radius-pill);
  background:linear-gradient(90deg,var(--color-cyan),var(--color-magenta));
  transition:width 900ms var(--ease);
}
.pct{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:var(--text-h2);font-weight:var(--weight-medium);
  letter-spacing:var(--tracking-tight);line-height:1;
}
.stage{
  position:relative;margin-top:var(--space-6);
  display:grid;height:22px;width:var(--width-prose);overflow:hidden;
}
.stage__line{
  grid-area:1/1;margin:0;
  font-size:14px;line-height:22px;color:var(--color-text-secondary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity var(--duration-base) linear;
}
.stage__line.is-current{opacity:1}
.loading__note{
  margin:var(--space-9) 0 0;font-size:var(--text-xs);color:var(--color-text-muted);
}
</style>
</head>
<body>

<div class="bloom" aria-hidden="true">
  <div class="bloom__orb bloom__orb--cyan"></div>
  <div class="bloom__orb bloom__orb--magenta"></div>
</div>

<header class="topbar"><a class="wordmark" href="/">Spark</a></header>

<main class="loading">
  <h1 class="loading__title">Reading TikTok</h1>

  <div class="loading__meter">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="42" id="bar">
          <div class="bar__fill" id="fill"></div>
    </div>
    <div class="pct" id="pct">12%</div>
  </div>

  <div class="stage" id="stage" aria-live="polite">
    <p class="stage__line is-current">Searching TikTok — "wavytalk" · #wavytalk</p>
    <p class="stage__line"></p>
  </div>

  <p class="loading__note">This takes about 10 minutes. Go make coffee — just don't close this tab, it's the only way back.</p>
</main>

<script>
(function () {
  var fill = document.getElementById('fill');
  var bar = document.getElementById('bar');
  var pct = document.getElementById('pct');
  var lines = document.querySelectorAll('.stage__line');
  var a = lines[0], b = lines[1];

  /* Real progress is polled from the server; these stages mirror the pipeline. */
  var STAGES = [
    {pct:12, html:'Searching TikTok \u2014 "wavytalk" \u00b7 #wavytalk', dur:3200},
    {pct:26, html:'Learning the brand\u2019s own hashtags \u2014 found 6 more ways creators tag it', dur:3500},
    {pct:34, html:'Learning the brand\u2019s own hashtags \u2014 #wavytalkthermalbrush, #wavytalkhair', dur:3500},
    {pct:52, html:'Crawling #wavytalkthermalbrush \u2014 8 of 17 terms', dur:3200},
    {pct:68, html:'Crawling #wavytalkpowerwave \u2014 14 of 17 terms', dur:3200},
    {pct:82, html:'Filtering 1,702 videos by reach, engagement and length', dur:3200},
    {pct:94, html:'Grabbing cover frames \u2014 47 videos', dur:3200}
  ];
  var i = 0;

  function swap(html) {
    b.innerHTML = html;
    b.classList.add('is-current');
    a.classList.remove('is-current');
    var t = a; a = b; b = t;
  }

  function advance() {
    if (i >= STAGES.length - 1) return;
    setTimeout(function () {
      i++;
      var s = STAGES[i];
      fill.style.width = s.pct + '%';
      bar.setAttribute('aria-valuenow', String(s.pct));
      pct.textContent = s.pct + '%';
      swap(s.html);
      advance();
    }, STAGES[i].dur);
  }
  advance();
})();
</script>
</body>
</html>
